functions = [
    { addr = 0x800B07DC, name = "func_800B07DC", zig = "actor_transform.offsetToWorld" },  # scratch offset -> world
]

[subsystem.battle_44F14.views]
types = ["D_800F4538_t", "actorTransformScratch"]
globals = []

[subsystem.battle_5BF94]
overlay = "battle"
unit = "src/BATTLE/BATTLE.PRG/5BF94.c"
default = "original"
roots = ["D_800EB9D8", "vs_battle_textBoxes", "vs_battle_stringContext"]
functions = [
